name: medusa_mobile
description: "Open-source Flutter storefront for Medusa v2."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^4.0.6
  carousel_slider: ^5.1.2
  collection: ^1.19.1
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_stripe: ^14.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Audiowide
      fonts:
        - asset: assets/fonts/Audiowide-Regular.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 100
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
